name: Update research report rules

on:
  push:
    paths:
      - '.github/report-rules-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update validator and report rules
        run: |
          python - <<'PY'
          from pathlib import Path

          # Validator: opportunity-area Community Findings placeholders are optional coverage,
          # not a validation incompleteness once the canonical structure exists.
          p = Path('scripts/research-validator.mjs')
          s = p.read_text()
          old = """  addIncompletePlaceholders(result, raw);\n  result.data = { opportunityAreas: taxonomyAreas };\n"""
          new = """  const optionalCommunityPlaceholderCount = areaRecords.reduce((sum, area) => {\n    const communityHeading = findNestedHeading(ast, area, 5, 'Community Findings');\n    if (!communityHeading) return sum;\n    const communityText = sectionNodes(ast, communityHeading).map(nodeText).join('\\n');\n    return sum + placeholderCount(communityText);\n  }, 0);\n  const requiredPlaceholderCount = Math.max(0, placeholderCount(raw) - optionalCommunityPlaceholderCount);\n  if (requiredPlaceholderCount > 0) {\n    result.incomplete.push(`${requiredPlaceholderCount} template placeholder${requiredPlaceholderCount === 1 ? '' : 's'} remain outside optional opportunity-area community research.`);\n  }\n  result.data = { opportunityAreas: taxonomyAreas };\n"""
          if old not in s:
              raise SystemExit('Validator patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Report: deterministic completion rule and clearer presentation.
          p = Path('scripts/research-report.mjs')
          s = p.read_text()

          old = """  const o = channel.overviewFacts;\n  const c = channel.capabilityFacts;\n  const currentStructure = channel.overviewStatus !== 'INVALID';\n  const steps = [];\n"""
          new = """  const o = channel.overviewFacts;\n  const c = channel.capabilityFacts;\n  const currentStructure = channel.overviewStatus !== 'INVALID';\n  const overviewStepStructure = currentStructure ? 'VALID' : channel.overviewStatus;\n  const steps = [];\n"""
          if old not in s:
              raise SystemExit('Report structure setup target not found')
          s = s.replace(old, new, 1)

          for old, new in [
              ("channel.overviewStatus));", "overviewStepStructure));"),
          ]:
              # Only replace occurrences inside buildMethodologySteps before capabilityStructure.
              head, sep, tail = s.partition("  const capabilityStructure = channel.capabilityStatus;")
              if not sep:
                  raise SystemExit('Capability structure marker not found')
              head = head.replace(old, new)
              s = head + sep + tail

          old = """  const totalAreas = o.opportunityAreas.length;\n  const phase2AreaComplete = totalAreas > 0 && o.fullyResearchedAreas === totalAreas;\n  const step8Started = o.assessmentRecords > 0;\n  const step8Status = phase2AreaComplete ? 'COMPLETE' : progressStatus(false, step8Started);\n  const step8Detail = totalAreas\n    ? `${o.assessmentRecords}/${totalAreas} assessment records are present; ${o.fullyResearchedAreas}/${totalAreas} opportunity areas are fully researched through Step 8A. Content presence is not treated as completed opportunity-area work.`\n    : 'No opportunity areas are available to assess.';\n  steps.push(makeStep('8', step8Status, step8Detail, overviewStepStructure));\n\n  const step8AComplete = totalAreas > 0 && o.communityAreas === totalAreas;\n  steps.push(makeStep('8A', progressStatus(step8AComplete, o.communityAreas > 0), totalAreas ? `${o.communityAreas}/${totalAreas} opportunity areas have substantive community findings.` : 'No opportunity areas are available for community research.', overviewStepStructure));\n\n  const capabilityStructure = channel.capabilityStatus;\n"""
          new = """  const totalAreas = o.opportunityAreas.length;\n  const step8Complete = o.assessmentRecords > 0;\n  steps.push(makeStep('8', progressStatus(step8Complete, false), totalAreas\n    ? `${o.assessmentRecords}/${totalAreas} opportunity areas have assessment records. Step 8 is complete once at least one opportunity area is assessed; additional area coverage is optional.`\n    : 'No opportunity areas are available to assess.', overviewStepStructure));\n\n  const step8AComplete = o.communityAreas > 0;\n  steps.push(makeStep('8A', progressStatus(step8AComplete, false), totalAreas\n    ? `${o.communityAreas}/${totalAreas} opportunity areas have substantive community findings. Step 8A is complete once at least one opportunity area has community research; additional area coverage is optional.`\n    : 'No opportunity areas are available for community research.', overviewStepStructure));\n\n  const capabilityStructure = channel.capabilityStatus === 'INVALID' ? 'INVALID' : channel.capabilityStatus === 'MISSING' ? 'MISSING' : 'VALID';\n"""
          if old not in s:
              raise SystemExit('Step 8/8A rules target not found')
          s = s.replace(old, new, 1)

          old = """function methodologyTable(channel) {\n  return `<table class=\"method-table\"><thead><tr><th>Step</th><th>Methodology</th><th>Progress</th><th>Evidence / coverage</th><th>Structure</th></tr></thead><tbody>${channel.steps.map((step) => `<tr><td class=\"step\">${esc(step.id)}</td><td>${esc(step.label)}</td><td>${progressBadge(step.status)}</td><td>${esc(step.detail)}</td><td>${structuralBadge(step.structure)}</td></tr>`).join('')}</tbody></table>`;\n}\n"""
          new = """function combinedStepStatus(step) {\n  const progress = progressBadge(step.status);\n  if (step.structure === 'INVALID' || step.structure === 'ISSUES') return `${progress} <span class=\"badge structure-invalid\">Structural issue</span>`;\n  if (step.structure === 'MISSING') return `${progress} <span class=\"badge structure-missing\">Missing document</span>`;\n  return progress;\n}\n\nfunction methodologyTable(channel) {\n  return `<table class=\"method-table\"><thead><tr><th>Step</th><th>Methodology</th><th>Status</th><th>Evidence / coverage</th></tr></thead><tbody>${channel.steps.map((step) => `<tr><td class=\"step\">${esc(step.id)}</td><td>${esc(step.label)}</td><td>${combinedStepStatus(step)}</td><td>${esc(step.detail)}</td></tr>`).join('')}</tbody></table>`;\n}\n\nfunction opportunityCoverage(channel) {\n  const total = channel.overviewFacts.opportunityAreas.length;\n  if (!total || channel.overviewStatus === 'INVALID') return '<span class=\"muted\">—</span>';\n  const complete = channel.overviewFacts.fullyResearchedAreas;\n  const pct = Math.max(0, Math.min(100, Math.round((complete / total) * 100)));\n  return `<div class=\"coverage\"><div class=\"coverage-fill\" style=\"width:${pct}%\"></div></div><div class=\"coverage-label\"><strong>${complete}/${total}</strong> fully researched</div>`;\n}\n\nfunction overallChannelStatus(channel) {\n  const applicable = channel.steps.filter((step) => step.status !== 'NOT_APPLICABLE');\n  const progressComplete = applicable.length > 0 && applicable.every((step) => step.status === 'COMPLETE');\n  const hasStructuralIssue = channel.steps.some((step) => step.status === 'ISSUE' || step.structure === 'INVALID' || step.structure === 'ISSUES');\n  if (progressComplete && hasStructuralIssue) return `${progressBadge('COMPLETE')} <span class=\"badge structure-invalid\">Structural fixes needed</span>`;\n  if (progressComplete) return progressBadge('COMPLETE');\n  if (hasStructuralIssue) return `${progressBadge('IN_PROGRESS')} <span class=\"badge structure-invalid\">Structural issue</span>`;\n  return progressBadge('IN_PROGRESS');\n}\n"""
          if old not in s:
              raise SystemExit('Methodology table target not found')
          s = s.replace(old, new, 1)

          old = """function channelRows(channels) {\n  return channels.map((channel) => {\n    const latestStep = [...channel.steps].reverse().find((step) => step.status === 'COMPLETE')?.id ?? '—';\n    const inProgress = channel.steps.filter((step) => step.status === 'IN_PROGRESS').map((step) => step.id).join(', ') || '—';\n    const search = esc(`${channel.name} ${channel.slug} ${channel.overviewStatus} ${channel.capabilityStatus}`.toLowerCase());\n    return `<tr class=\"channel-row\" data-search=\"${search}\" data-status=\"${channel.overviewStatus}\">\n      <td><strong>${esc(channel.name)}</strong><div class=\"path\">${esc(channel.slug)}</div></td>\n      <td>${structuralBadge(channel.overviewStatus)}</td>\n      <td>${structuralBadge(channel.capabilityStatus)}</td>\n      <td>${esc(latestStep)}</td>\n      <td>${esc(inProgress)}</td>\n      <td><details><summary>View methodology progress</summary><div class=\"detail\">\n"""
          new = """function channelRows(channels) {\n  return channels.map((channel) => {\n    const inProgress = channel.steps.filter((step) => step.status === 'IN_PROGRESS').map((step) => step.id).join(', ') || '—';\n    const search = esc(`${channel.name} ${channel.slug} ${channel.overviewStatus} ${channel.capabilityStatus}`.toLowerCase());\n    return `<tr class=\"channel-row\" data-search=\"${search}\" data-status=\"${channel.overviewStatus}\">\n      <td><strong>${esc(channel.name)}</strong><div class=\"path\">${esc(channel.slug)}</div></td>\n      <td>${overallChannelStatus(channel)}</td>\n      <td>${opportunityCoverage(channel)}</td>\n      <td>${structuralBadge(channel.overviewStatus)}</td>\n      <td>${structuralBadge(channel.capabilityStatus)}</td>\n      <td>${esc(inProgress)}</td>\n      <td><details><summary>View methodology progress</summary><div class=\"detail\">\n"""
          if old not in s:
              raise SystemExit('Channel rows target not found')
          s = s.replace(old, new, 1)

          old = """.method-table th:nth-child(1){width:55px}.method-table th:nth-child(3){width:120px}.method-table th:nth-child(5){width:100px}@media(max-width:760px)"""
          new = """.method-table th:nth-child(1){width:55px}.method-table th:nth-child(3){width:190px}.coverage{width:130px;max-width:100%;height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:5px}.coverage-fill{height:100%;background:#16a34a}.coverage-label{font-size:12px;white-space:nowrap}@media(max-width:760px)"""
          if old not in s:
              raise SystemExit('CSS target not found')
          s = s.replace(old, new, 1)

          old = """<div class=\"panel\"><div class=\"controls\"><input id=\"search\" placeholder=\"Search channel\"><select id=\"filter\"><option value=\"ALL\">All overview structures</option><option value=\"VALID\">Valid</option><option value=\"INCOMPLETE\">Incomplete</option><option value=\"INVALID\">Issue</option></select></div><table><thead><tr><th>Channel</th><th>Overview structure</th><th>Capability structure</th><th>Latest completed step</th><th>Step(s) in progress</th><th>Detail</th></tr></thead><tbody id=\"channels\">${channelRows(channels)}</tbody></table></div>\n"""
          new = """<div class=\"panel\"><div class=\"controls\"><input id=\"search\" placeholder=\"Search channel\"><select id=\"filter\"><option value=\"ALL\">All overview structures</option><option value=\"VALID\">Valid</option><option value=\"INCOMPLETE\">Incomplete</option><option value=\"INVALID\">Issue</option></select></div><table><thead><tr><th>Channel</th><th>Overall</th><th>Opportunity coverage</th><th>Overview structure</th><th>Capability structure</th><th>Step(s) in progress</th><th>Detail</th></tr></thead><tbody id=\"channels\">${channelRows(channels)}</tbody></table></div>\n"""
          if old not in s:
              raise SystemExit('Channels table header target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Sanity check scripts
        run: |
          node --check scripts/research-validator.mjs
          node --check scripts/research-report.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research-validator.mjs scripts/research-report.mjs
          git commit -m "Refine research progress and coverage rules"
          git push
