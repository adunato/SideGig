name: Research document validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/validation-trigger.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator dependencies
        run: npm install --no-audit --no-fund

      - name: Validate research documents
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          npm run validate:research 2>&1 | tee validation-report.txt

      - name: Generate HTML progress report
        if: always()
        run: npm run report:research

      - name: Generate channel insights dashboard
        if: always()
        run: npm run dashboard:research

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-validation-report
          path: |
            validation-report.txt
            research-validation-report.html
            research-validation-report.json
            research-insights-dashboard.html
          retention-days: 30

      - name: Fail workflow when validation fails
        if: steps.validate.outcome == 'failure'
        run: exit 1
