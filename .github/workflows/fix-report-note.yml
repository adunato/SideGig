name: Fix research report note

on:
  push:
    paths:
      - '.github/report-note-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update report explanation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research-report.mjs')
          s=p.read_text()
          old='<div class="note"><strong>Progress rule:</strong> the report follows the numbered methodology. Presence of content is evidence, not automatically completion. In particular, populated Step 8 assessment records are not presented as completed opportunity-area work while the required Step 8A research for those areas remains unfinished. Structural validity is shown separately from research progress.</div>'
          new='<div class="note"><strong>Progress rule:</strong> the report follows the numbered methodology. For Steps 8 and 8A, completing at least one opportunity area satisfies the step; coverage is shown separately so the breadth of research remains visible. Optional unresearched opportunity areas do not make the document structurally incomplete. Structural issues in required artifacts qualify the overall status.</div>'
          if old not in s:
              raise SystemExit('Expected report note not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/research-report.mjs
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research-report.mjs
          git commit -m "Clarify research report progress rule"
          git push
