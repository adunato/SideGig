name: Apply news and media deep dive

on:
  push:
    paths:
      - '.github/news-media-deep-dive-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deep-dive migration
        run: node scripts/apply-news-media-deep-dive.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate research documents
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          npm run validate:research 2>&1 | tee validation-report.txt

      - name: Generate HTML progress report
        if: always()
        run: npm run report:research

      - name: Generate channel insights dashboard
        if: always()
        run: npm run dashboard:research

      - name: Commit deep-dive changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research scripts/research-validator.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Complete Apify news and media deep dive"
            git push
          fi

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-media-deep-dive
          path: |
            validation-report.txt
            research-validation-report.html
            research-validation-report.json
            research-insights-dashboard.html
          retention-days: 30
