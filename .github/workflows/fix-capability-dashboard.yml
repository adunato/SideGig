name: Fix capability dashboard rendering

on:
  push:
    paths:
      - '.github/workflows/fix-capability-dashboard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix literal replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/research-dashboard-capability-scores.mjs')
          s = p.read_text()
          old = 'out = out.replace(blockPattern, replacement);'
          new = 'out = out.replace(blockPattern, () => replacement);'
          if old not in s:
              raise SystemExit('Expected replacement line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate research documents
        continue-on-error: true
        run: |
          set -o pipefail
          npm run validate:research 2>&1 | tee validation-report.txt

      - name: Generate progress report
        run: npm run report:research

      - name: Generate corrected dashboard
        run: npm run dashboard:research

      - name: Commit generator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research-dashboard-capability-scores.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Fix capability synthesis dashboard rendering"
            git push
          fi

      - name: Upload corrected dashboard
        uses: actions/upload-artifact@v4
        with:
          name: corrected-capability-dashboard
          path: research-insights-dashboard.html
          retention-days: 30
