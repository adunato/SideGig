name: Research document validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/**/*.md'
      - 'scripts/research-validator.mjs'
      - 'package.json'
      - '.github/workflows/research-validation.yml'
  pull_request:
    paths:
      - 'research/**/*.md'
      - 'scripts/research-validator.mjs'
      - 'package.json'
      - '.github/workflows/research-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator dependencies
        run: npm install --no-audit --no-fund

      - name: Validate research documents
        run: npm run validate:research
