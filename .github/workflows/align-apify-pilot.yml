name: Align Apify pilot structure

on:
  push:
    paths:
      - '.github/workflows/align-apify-pilot.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Align pilot documents
        run: python scripts/align-apify-pilot.py
      - name: Commit aligned documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/channels/apify/overview.md research/channels/apify/capability.md
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Align Apify pilot with canonical templates"
            git push
          fi
